[Rainmeter]
Update=50
AccurateText=1

[Metadata]
Name=Chores
Information=Clickable open chores from the "### Chores" section. Click a row to check it off.

[Variables]
; Same file as Tasks — chores live under a "### Chores" heading in it.
TaskFile=CONFIGURE
FontName=Segoe UI
FontSize=11
FontColor=220,220,220,255
HoverColor=255,255,255,255
BGColor=20,20,20,200
Slots=15
MaxTasks=15
Section=Chores
EmptyText=No chores left
PadX=16
GapTop=14
Gap=6
PadBottom=16
PanelW=340

[styleSlot]
X=#PadX#
W=(#PanelW#-#PadX#-#PadX#)
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#FontColor#
AntiAlias=1
ClipString=2
DynamicVariables=1

[MeasureChores]
Measure=Script
ScriptFile=#CURRENTPATH#Chores.lua
UpdateDivider=200

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,#PanelW#,([MeterTask15:Y]+[MeterTask15:H]+#PadBottom#),10 | Fill Color #BGColor# | StrokeWidth 0
DynamicVariables=1

[MeterTitle]
Meter=String
X=#PadX#
Y=14
FontFace=#FontName#
FontSize=13
FontColor=255,179,71,255
StringStyle=Bold
AntiAlias=1
Text=CHORES

[MeterTask1]
Meter=String
MeterStyle=styleSlot
Y=#GapTop#R
Text=
LeftMouseUpAction=[!CommandMeasure "MeasureChores" "toggle(1)"][!UpdateMeasure "MeasureChores"][!Redraw]
MouseOverAction=[!SetOption MeterTask1 FontColor #HoverColor#][!Redraw]
MouseLeaveAction=[!SetOption MeterTask1 FontColor #FontColor#][!Redraw]

