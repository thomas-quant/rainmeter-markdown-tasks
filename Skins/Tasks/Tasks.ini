[Rainmeter]
; 50ms tick keeps hover highlight snappy; the file itself is only re-read every 10s
; (UpdateDivider 200 on the measure below). Rows are static, so fast ticks are cheap.
Update=50
AccurateText=1

[Metadata]
Name=Tasks
Information=Clickable open tasks from the "### Tasks" section. Click a row to check it off.

[Variables]
; ── CONFIGURE: full Windows path to your tasks .md file ──
TaskFile=CONFIGURE
FontName=Segoe UI
FontSize=11
FontColor=220,220,220,255
HoverColor=255,255,255,255
BGColor=20,20,20,200
Slots=15
MaxTasks=15
Section=Tasks
EmptyText=No open tasks
; ── padding (px) ──  PadX: left/right inset · GapTop: title→first row · Gap: between rows · PadBottom: below last row
PadX=16
GapTop=14
Gap=6
PadBottom=16
PanelW=340

[styleSlot]
X=#PadX#
W=(#PanelW#-#PadX#-#PadX#)
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#FontColor#
AntiAlias=1
ClipString=2
DynamicVariables=1

[MeasureTasks]
Measure=Script
ScriptFile=#CURRENTPATH#Tasks.lua
UpdateDivider=200

[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,#PanelW#,([MeterTask15:Y]+[MeterTask15:H]+#PadBottom#),10 | Fill Color #BGColor# | StrokeWidth 0
DynamicVariables=1

[MeterTitle]
Meter=String
X=#PadX#
Y=14
FontFace=#FontName#
FontSize=13
FontColor=255,255,255,255
StringStyle=Bold
AntiAlias=1
Text=TASKS

[MeterTask1]
Meter=String
MeterStyle=styleSlot
Y=#GapTop#R
Text=
LeftMouseUpAction=[!CommandMeasure "MeasureTasks" "toggle(1)"][!UpdateMeasure "MeasureTasks"][!Redraw]
MouseOverAction=[!SetOption MeterTask1 FontColor #HoverColor#][!Redraw]
MouseLeaveAction=[!SetOption MeterTask1 FontColor #FontColor#][!Redraw]

